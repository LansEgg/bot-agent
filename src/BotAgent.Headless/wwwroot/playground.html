<!DOCTYPE html>
<html lang="zh-CN" data-theme="system">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#f3f3f3" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#202020" media="(prefers-color-scheme: dark)" />
<title>Bot Agent · 交互演练场</title>
<link rel="stylesheet" href="/app.css" />
<link rel="stylesheet" href="/trace.css" />
<style>
  .pg-shell { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; height: calc(100vh - 64px); padding: 16px; box-sizing: border-box; }
  @media (max-width: 900px) { .pg-shell { grid-template-columns: 1fr; height: auto; } }
  .pg-col { display: flex; flex-direction: column; gap: 12px; height: 100%; min-height: 0; }
  .pg-card { background: var(--bg-card, #fff); border: 1px solid var(--border, #e0e0e0); border-radius: 8px; padding: 16px; box-sizing: border-box; }
  .pg-card-scroll { flex: 1; overflow-y: auto; }
  .pg-header { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; background: var(--bg-card, #fff); border-bottom: 1px solid var(--border, #e0e0e0); }
  .pg-header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  .pg-nav-link { color: var(--accent, #0067c0); text-decoration: none; font-size: 14px; }
  .pg-row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
  .pg-row label { font-size: 13px; min-width: 80px; color: var(--fg-muted, #666); }
  .pg-input, .pg-select, .pg-textarea { flex: 1; padding: 8px 10px; border: 1px solid var(--border, #ccc); border-radius: 6px; font-size: 14px; background: var(--bg-input, #fafafa); color: inherit; }
  .pg-textarea { min-height: 70px; resize: vertical; }
  .pg-btn { padding: 8px 16px; border-radius: 6px; border: none; background: var(--accent, #0067c0); color: #fff; font-size: 14px; cursor: pointer; font-weight: 500; }
  .pg-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .pg-btn-sub { background: var(--bg-sub, #eee); color: inherit; border: 1px solid var(--border, #ccc); }
  .pg-msg-list { display: flex; flex-direction: column; gap: 8px; padding: 8px 0; }
  .pg-msg { padding: 8px 12px; border-radius: 6px; font-size: 13px; line-height: 1.5; max-width: 85%; }
  .pg-msg.user { align-self: flex-end; background: var(--accent-light, #e5f1fb); color: var(--fg, #000); }
  .pg-msg.bot { align-self: flex-start; background: var(--bg-bubble, #f0f0f0); color: var(--fg, #000); }
  .pg-msg-meta { font-size: 11px; color: var(--fg-muted, #888); margin-bottom: 4px; }
  .pg-tag { display: inline-block; padding: 2px 6px; border-radius: 4px; font-size: 11px; font-weight: 500; background: var(--bg-muted, #eee); color: var(--fg-muted, #555); margin-right: 4px; }
  .pg-approval-box { border: 1px dashed var(--warn, #e6a23c); background: #fdf6ec; padding: 12px; border-radius: 6px; margin-bottom: 12px; }
</style>
</head>
<body>

<header class="pg-header">
  <div style="display:flex; align-items:center; gap:12px;">
    <h1>Bot Agent · 交互演练场</h1>
    <span class="pg-tag" id="channelStatusTag">本地合成通道</span>
  </div>
  <div>
    <a href="/" class="pg-nav-link">返回控制台 ↗</a>
  </div>
</header>

<main class="pg-shell">
  <!-- 左栏：本地合成注入 -->
  <section class="pg-col">
    <div class="pg-card">
      <div class="pg-row">
        <label for="sceneSelect">预设场景</label>
        <select id="sceneSelect" class="pg-select">
          <option value="1" data-name="技术交流群">技术交流群（group:1）</option>
          <option value="2" data-name="资料讨论群">资料讨论群（group:2）</option>
          <option value="3" data-name="生活兴趣群">生活兴趣群（group:3）</option>
        </select>
      </div>

      <div class="pg-row">
        <label>触发模式</label>
        <div style="display:flex; gap:16px; align-items:center; font-size:13px;">
          <label style="min-width:auto; display:flex; align-items:center; gap:4px; cursor:pointer;">
            <input type="radio" name="triggerMode" value="plain" checked /> 普通文字
          </label>
          <label style="min-width:auto; display:flex; align-items:center; gap:4px; cursor:pointer;">
            <input type="radio" name="triggerMode" value="mention" /> 模拟 @ 机器人
          </label>
          <label style="min-width:auto; display:flex; align-items:center; gap:4px; cursor:pointer;">
            <input type="radio" name="triggerMode" value="quote" /> 模拟引用回复
          </label>
        </div>
      </div>

      <div class="pg-row">
        <label for="senderName">模拟用户</label>
        <input id="senderName" class="pg-input" type="text" value="群友A" />
      </div>

      <div class="pg-row" style="align-items:flex-start;">
        <label for="inputMsg" style="margin-top:6px;">消息正文</label>
        <textarea id="inputMsg" class="pg-textarea" placeholder="输入合成消息进行现场推演…"></textarea>
      </div>

      <div style="display:flex; justify-content:space-between; align-items:center; margin-top:8px;">
        <span id="injectHint" style="font-size:12px; color:var(--fg-muted, #666);">就绪：消息将通过 IQqChatSource 本地通道全链路注入</span>
        <button id="sendBtn" type="button" class="pg-btn">注入演练 ↵</button>
      </div>
    </div>

    <!-- 会话观察气泡列表 -->
    <div class="pg-card pg-card-scroll">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
        <span style="font-size:13px; font-weight:600;">本地通道交互记录</span>
        <button id="clearChatBtn" type="button" class="pg-btn pg-btn-sub" style="padding:4px 8px; font-size:12px;">清屏</button>
      </div>
      <div id="chatList" class="pg-msg-list"></div>
    </div>
  </section>

  <!-- 右栏：六步治理节点卡片与人工审批卡 -->
  <section class="pg-col">
    <div class="pg-card pg-card-scroll">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
        <div>
          <span style="font-size:14px; font-weight:600;">本轮执行六节点分析</span>
          <span id="currentRunId" style="font-size:12px; color:var(--fg-muted, #888); margin-left:8px;">等待执行…</span>
        </div>
        <button id="refreshTraceBtn" type="button" class="pg-btn pg-btn-sub" style="padding:4px 8px; font-size:12px;">刷新轨迹</button>
      </div>

      <!-- 待批审批卡容器 -->
      <div id="approvalSection" hidden class="pg-approval-box">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <strong style="color:#e6a23c; font-size:13px;">⚠ 发现待批动作</strong>
          <span id="approvalCountdown" style="font-size:12px; color:#888;"></span>
        </div>
        <p id="approvalSummary" style="font-size:13px; margin:6px 0;"></p>
        <div style="display:flex; gap:8px; margin-top:8px;">
          <button id="approveBtn" type="button" class="pg-btn" style="background:#67c23a; padding:4px 12px; font-size:12px;">批准执行</button>
          <button id="rejectBtn" type="button" class="pg-btn" style="background:#f56c6c; padding:4px 12px; font-size:12px;">拒绝</button>
        </div>
      </div>

      <!-- 六节点时间轴流 -->
      <div id="nodesTimeline" style="display:flex; flex-direction:column; gap:8px;"></div>
    </div>
  </section>
</main>

<script>
(() => {
  "use strict";

  const NODES = [
    { kind: "Participation", label: "① 参与判断状态机", hint: "自律与插话判断" },
    { kind: "Context", label: "② 滑窗上下文", hint: "上下文裁剪与画像装配" },
    { kind: "Model", label: "③ 模型决策", hint: "思考/直接回复/调用工具" },
    { kind: "Gate", label: "④ Fail-Closed 闸门", hint: "能力白名单与单轮预算" },
    { kind: "ToolExec", label: "⑤ 工具执行耗时", hint: "工具沙盒与耗时统计" },
    { kind: "Outbound", label: "⑥ 纯文本净化", hint: "Markdown净化与回复审计" }
  ];

  const STATUS_TEXT = {
    ok: "正常", allowed: "放行", sent: "已发出", done: "完成",
    silent: "沉默", approval_required: "待审批", pending: "待审批",
    partial: "部分发出", denied: "拒绝", blocked: "拦截", failed: "失败", error: "出错"
  };

  const STATUS_CLASS = {
    ok: "ok", allowed: "ok", sent: "ok", done: "ok",
    silent: "mute", approval_required: "warn", pending: "warn", partial: "warn",
    denied: "bad", blocked: "bad", failed: "bad", error: "bad"
  };

  let token = "";
  try {
    token = localStorage.getItem("qqchat_token") || "";
  } catch {}

  function getHeaders() {
    const h = { "Content-Type": "application/json" };
    if (token) h["Authorization"] = "Bearer " + token;
    return h;
  }

  function el(tag, className, text) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined && text !== null && text !== "") node.textContent = String(text);
    return node;
  }

  function renderNodes(nodes) {
    const host = document.getElementById("nodesTimeline");
    if (!host) return;
    host.replaceChildren();

    for (const spec of NODES) {
      const match = (nodes || []).filter(n => n.kind === spec.kind);
      const box = el("section", "card trace-card");
      const head = el("div", "trace-card-head");
      head.appendChild(el("span", "trace-card-title", spec.label));
      head.appendChild(el("span", "trace-card-hint", spec.hint));

      const status = match.length > 0 ? match[match.length - 1].status : "mute";
      const badge = el("span", "trace-badge " + (STATUS_CLASS[status] || "mute"), match.length > 0 ? (STATUS_TEXT[status] || status) : "未发生");
      head.appendChild(badge);
      box.appendChild(head);

      if (match.length === 0) {
        box.appendChild(el("p", "trace-node mute", "本轮未到达该节点。"));
      } else {
        for (const item of match) {
          const line = el("p", "trace-node " + (STATUS_CLASS[item.status] || "mute"));
          line.appendChild(el("span", "trace-dot"));
          const text = [
            STATUS_TEXT[item.status] || item.status,
            (item.ms || 0) + "ms",
            item.tool || null,
            item.reason || null,
            item.count !== null && item.count !== undefined ? ("计数 " + item.count) : null
          ].filter(Boolean).join(" · ");
          line.appendChild(el("span", "trace-node-text", text));
          box.appendChild(line);
        }
      }

      host.appendChild(box);
    }
  }

  function appendChat(role, sender, text) {
    const list = document.getElementById("chatList");
    if (!list) return;
    const msg = el("div", "pg-msg " + role);
    const meta = el("div", "pg-msg-meta", sender + " · " + new Date().toLocaleTimeString());
    msg.appendChild(meta);
    msg.appendChild(el("div", null, text));
    list.appendChild(msg);
    list.scrollTop = list.scrollHeight;
  }

  async function pollTraces() {
    try {
      const res = await fetch("/api/traces?limit=5", { headers: getHeaders() });
      if (!res.ok) return;
      const data = await res.json();
      if (!data || !data.traces || data.traces.length === 0) return;
      const latest = data.traces[0];
      const runSpan = document.getElementById("currentRunId");
      if (runSpan) {
        runSpan.textContent = "Run: " + latest.runId + " (" + latest.totalMs + "ms · " + (STATUS_TEXT[latest.outcome] || latest.outcome) + ")";
      }
      renderNodes(latest.nodes || []);
    } catch {}
  }

  let activeRequestId = "";
  async function pollApprovals() {
    try {
      const res = await fetch("/api/approvals", { headers: getHeaders() });
      if (!res.ok) return;
      const data = await res.json();
      const sec = document.getElementById("approvalSection");
      if (!sec) return;

      if (data && data.pending && data.pending.length > 0) {
        const item = data.pending[0];
        activeRequestId = item.id;
        sec.hidden = false;
        document.getElementById("approvalSummary").textContent = "[" + item.toolId + "] " + item.summary + " (" + item.key + ")";
        document.getElementById("approvalCountdown").textContent = "剩余 " + item.remainingSeconds + "s";
      } else {
        sec.hidden = true;
        activeRequestId = "";
      }
    } catch {}
  }

  async function sendLocal() {
    const textInput = document.getElementById("inputMsg");
    const text = (textInput?.value || "").trim();
    if (!text) return;

    const sceneSelect = document.getElementById("sceneSelect");
    const id = Number(sceneSelect?.value || 1);
    const sender = (document.getElementById("senderName")?.value || "群友A").trim();
    const mode = document.querySelector('input[name="triggerMode"]:checked')?.value || "plain";

    const isMention = mode === "mention";
    const isQuote = mode === "quote";

    appendChat("user", sender, (isMention ? "@机器人 " : "") + text);
    textInput.value = "";

    const btn = document.getElementById("sendBtn");
    const hint = document.getElementById("injectHint");
    if (btn) btn.disabled = true;
    if (hint) hint.textContent = "正在通过生产编排链路处理…";

    try {
      const payload = {
        id: id,
        text: text,
        sender: sender,
        isGroup: true,
        mentioned: isMention,
        replyTo: isQuote ? 100 : null
      };

      const res = await fetch("/api/local/message", {
        method: "POST",
        headers: getHeaders(),
        body: JSON.stringify(payload)
      });

      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        appendChat("bot", "系统通知", "注入失败：" + (err.error || res.statusText));
      }
    } catch (e) {
      appendChat("bot", "系统通知", "通信失败：" + (e.message || String(e)));
    } finally {
      if (btn) btn.disabled = false;
      if (hint) hint.textContent = "就绪：消息已注入，正在同步轨迹";
      setTimeout(pollTraces, 800);
      setTimeout(pollApprovals, 900);
    }
  }

  async function decideApproval(approve) {
    if (!activeRequestId) return;
    try {
      const res = await fetch("/api/approvals/decide", {
        method: "POST",
        headers: getHeaders(),
        body: JSON.stringify({ id: activeRequestId, approve: approve })
      });
      const ret = await res.json().catch(() => ({}));
      appendChat("bot", "审批决议", (approve ? "已批准" : "已拒绝") + " 审批单 " + activeRequestId + "（" + (ret.reason || "ok") + "）");
      pollApprovals();
      setTimeout(pollTraces, 500);
    } catch (e) {
      alert("审批失败: " + e.message);
    }
  }

  // 初始化绑定
  document.getElementById("sendBtn")?.addEventListener("click", sendLocal);
  document.getElementById("inputMsg")?.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      sendLocal();
    }
  });
  document.getElementById("clearChatBtn")?.addEventListener("click", () => {
    document.getElementById("chatList")?.replaceChildren();
  });
  document.getElementById("refreshTraceBtn")?.addEventListener("click", () => {
    pollTraces();
    pollApprovals();
  });
  document.getElementById("approveBtn")?.addEventListener("click", () => decideApproval(true));
  document.getElementById("rejectBtn")?.addEventListener("click", () => decideApproval(false));

  renderNodes([]);
  pollTraces();
  pollApprovals();
  setInterval(pollApprovals, 3000);
})();
</script>

</body>
</html>
